name: release

# 发布 = 打一个 v<version> 标签。流程：跑用例 → npm pack 出 tarball → 建 GitHub Release。
# 不发 npm：package.json 写着 private，也没有仓库凭据；tarball 挂出来，谁要谁能装。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: node --test
        run: node --test

  pack:
    name: pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 标签和版本对得上吗
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          if [ "$tag" != "$pkg" ]; then
            echo "标签是 $GITHUB_REF_NAME，package.json 里是 $pkg；先改版本再打标签" >&2
            exit 1
          fi

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: tarball 里得有 bin 和 src
        shell: bash
        run: |
          # 先把清单落成文件再 grep：grep -q 找到就退出，会让 tar 吃到 SIGPIPE，
          # 而 GH 的 bash 默认带 pipefail，于是"检查通过"反倒让整步失败。
          set -e
          # tr -d '\r'：Windows 上 tar 的清单带 CRLF，`grep -x` 会一条都对不上
          tar -tzf dist/*.tgz | tr -d '\r' > tarball-list.txt
          cat tarball-list.txt
          missing=''
          grep -qxF 'package/bin/agent-man.mjs' tarball-list.txt || missing="$missing package/bin/agent-man.mjs"
          grep -qxF 'package/src/cli.mjs' tarball-list.txt || missing="$missing package/src/cli.mjs"
          if [ -n "$missing" ]; then
            echo "::error::tarball 里缺：$missing；实际清单：$(tr '\n' ' ' < tarball-list.txt)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
