name: release

# 发布 = 打一个 v<version> 标签。流程：跑用例 → npm pack 出 tarball → 建 GitHub Release。
# 不发 npm：package.json 写着 private，也没有仓库凭据；tarball 挂出来，谁要谁能装。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: node --test
        run: node --test

  pack:
    name: pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 标签和版本对得上吗
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          if [ "$tag" != "$pkg" ]; then
            echo "标签是 $GITHUB_REF_NAME，package.json 里是 $pkg；先改版本再打标签" >&2
            exit 1
          fi

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: tarball 里得有 bin 和 src
        shell: bash
        run: |
          # 先把清单落成文件再 grep：grep -q 找到就退出，会让 tar 吃到 SIGPIPE，
          # 而 GH 的 bash 默认带 pipefail，于是"检查通过"反倒让整步失败。
          set -e
          # tr -d '\r'：Windows 上 tar 的清单带 CRLF，`grep -x` 会一条都对不上
          tar -tzf dist/*.tgz | tr -d '\r' > tarball-list.txt
          cat tarball-list.txt
          missing=''
          grep -qxF 'package/bin/agent-man.mjs' tarball-list.txt || missing="$missing package/bin/agent-man.mjs"
          grep -qxF 'package/src/cli.mjs' tarball-list.txt || missing="$missing package/src/cli.mjs"
          if [ -n "$missing" ]; then
            echo "::error::tarball 里缺：$missing；实际清单：$(tr '\n' ' ' < tarball-list.txt)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tgz
          if-no-files-found: error

  release:
    name: release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist

      - name: 建 Release（正文来自标签）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # v0.2.0 的正文只有自动 Changelog，因为这条命令只会 --generate-notes。
          # v0.2.1 想改用标签注解，却在 CI 里撞上第二个坑：actions/checkout 检出一个标签时会
          # 执行 git fetch origin +<commit sha>:refs/tags/<name>，把标签 ref 直接指到提交上，
          # 注解对象就此被抹平——本地 git cat-file -t 说 commit，%(contents) 拿到的是提交信息。
          # 所以别问本地 git，直接问 API 要标签对象。（顺带：这个 job 现在不用 checkout 了，
          # 少一步也快几秒；-R 仍然不能省，没有 .git 时 gh 猜不出是哪个仓库。）
          read -r obj_type obj_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          args=(-R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME")
          if [ "$obj_type" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.message' > notes.md
            if grep -q '[^[:space:]]' notes.md; then
              args+=(--notes-file notes.md)
            else
              args+=(--generate-notes)
            fi
          else
            # 轻量标签没有注解：拿提交信息当发布说明是误导，退回自动 Changelog。
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tgz "${args[@]}"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json tagName,assets
