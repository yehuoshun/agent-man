name: ci

# 零依赖，所以这里没有 npm install：拉下来直接跑用例，几秒钟。
# Windows 一定要进矩阵——CRLF、BOM、反斜杠这几类事故全都在 Windows 上才出得来。
on:
  push:
    branches: [v1, main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }} ${{ matrix.tz || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 七个组合一条条写出来，不用 os × node 两个维度：matrix 的 include 会**合并**到已匹配的组合上，
      # 写成显式列表才不会悄悄少一条腿。
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '20'
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24'
          # 第 7 条腿：西半球时区。用例里凡是"本地某天某点"的，只有离开东八区才看得出有没有把 +08:00 写死。
          - os: ubuntu-latest
            node: '24'
            tz: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: node --test
        shell: bash
        env:
          TZ: ${{ matrix.tz || 'UTC' }}
        run: |
          set -o pipefail
          node --test 2>&1 | tee node-test.log

      # 红了才跑：把最后一段输出贴成注解。公开仓库里没登录也能看见红在哪，因为日志本身要鉴权。
      - name: 失败时把输出贴成注解
        if: failure()
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs')
          const t = fs.readFileSync('node-test.log', 'utf8')
          const s = t.slice(-4000).replace(/%/g, '%25').replace(/\r/g, '').replace(/\n/g, '%0A')
          console.log('::error::' + s)
          "

      # 每次推上都留一个能装的 tarball，不用等发版
      - name: npm pack
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24' && !matrix.tz
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24' && !matrix.tz
        with:
          name: agent-man-tarball
          path: dist/*.tgz
          if-no-files-found: error
